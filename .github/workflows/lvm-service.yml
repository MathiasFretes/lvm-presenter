name: LVM service import
on:
  push:
    branches: [codex/service-import]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:lvm
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:playwright -- --grep "offline Sunday service"
